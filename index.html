<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>下一餐吃什麼~ 靈魂美食顧問</title>
    <!-- 引入 Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts: 思源黑體 與 思源宋體 -->
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght=400;500;700;900&family=Noto+Serif+TC:wght=600;900&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Noto Sans TC', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "PingFang TC", "Microsoft JhengHei", sans-serif;

            font-size: 1.05rem;

        }

            font-family: 'Noto Serif TC', "PingFang TC", "Microsoft JhengHei", serif;

            width: 5px;
        }
        ::-webkit-scrollbar-track {
            background: #FDFBF7;
        }
        ::-webkit-scrollbar-thumb {
            background: #FFE5D9;
            border-radius: 10px;
        }
    </style>
</head>
<body class="text-stone-800 min-h-screen flex flex-col antialiased">

    <!-- 頂部看板 -->
    <header class="bg-[#FFF3CD] border-b border-[#FCE8A6] py-3 md:py-6 px-4 sticky md:relative top-0 z-50 shadow-sm">
        <div class="max-w-4xl mx-auto flex flex-row md:flex-col items-center justify-start md:justify-center gap-3 md:gap-4">
            <!-- 吉祥物 SVG -->
            <div class="w-16 h-10 md:w-56 md:h-28 flex items-center justify-center shrink-0">
                <svg viewBox="0 0 400 200" class="w-full h-full drop-shadow-sm">
                    <path d="M 195 45 C 190 35, 175 35, 175 50 C 175 65, 195 80, 195 80 C 195 80, 215 65, 215 50 C 215 35, 200 35, 195 45 Z" fill="#FFB5A7" opacity="0.8"/>
                    <path d="M 60 30 L 65 35 L 60 40 L 55 35 Z" fill="#FFF" />
                    <path d="M 340 50 L 345 55 L 340 60 L 335 55 Z" fill="#FFF" />
                    <circle cx="210" cy="120" r="4" fill="#FFCAD4" opacity="0.6"/>
                    <circle cx="160" cy="60" r="5" fill="#FFCAD4" opacity="0.6"/>
                    
                    <!-- 珍珍 (珍珠奶茶) -->
                    <g id="zhen-zhen">
                        <path d="M 110 70 L 120 150 C 121 158, 169 158, 170 150 L 180 70 Z" fill="#E6CCB2" stroke="#7F5539" stroke-width="4" stroke-linejoin="round"/>
                        <line x1="150" y1="70" x2="155" y2="35" stroke="#B7B7A4" stroke-width="10" stroke-linecap="round"/>
                        <path d="M 105 70 L 185 70" stroke="#7F5539" stroke-width="4" stroke-linecap="round"/>
                        <circle cx="130" cy="140" r="7" fill="#2F1F17"/>
                        <circle cx="145" cy="143" r="7" fill="#2F1F17"/>
                        <circle cx="160" cy="138" r="7" fill="#2F1F17"/>
                        <circle cx="138" cy="128" r="7" fill="#2F1F17"/>
                        <circle cx="154" cy="126" r="7" fill="#2F1F17"/>
                        <circle cx="135" cy="98" r="8" fill="#2F1F17"/>
                        <circle cx="133" cy="95" r="3" fill="#FFF"/>
                        <circle cx="160" cy="98" r="8" fill="#2F1F17"/>
                        <circle cx="158" cy="95" r="3" fill="#FFF"/>
                        <path d="M 144 106 Q 147 111, 151 106" fill="none" stroke="#2F1F17" stroke-width="2.5" stroke-linecap="round"/>
                        <ellipse cx="125" cy="105" rx="5" ry="3" fill="#FFB5A7"/>
                        <ellipse cx="170" cy="105" rx="5" ry="3" fill="#FFB5A7"/>
                        <path d="M 172 110 Q 190 115, 185 125" fill="none" stroke="#7F5539" stroke-width="4" stroke-linecap="round"/>
                        <path d="M 130 155 Q 130 168, 135 168" fill="none" stroke="#7F5539" stroke-width="4" stroke-linecap="round"/>
                        <path d="M 160 155 Q 160 168, 155 168" fill="none" stroke="#7F5539" stroke-width="4" stroke-linecap="round"/>
                    </g>

                    <!-- 雞排君 (炸雞排) -->
                    <g id="ji-pai-jun">
                        <path d="M 215 125 C 190 100, 210 65, 240 60 C 270 55, 300 70, 310 95 C 320 120, 290 150, 260 152 C 235 154, 225 135, 215 125 Z" fill="#FFB703" stroke="#FB8500" stroke-width="4" stroke-linejoin="round"/>
                        <circle cx="235" cy="85" r="2" fill="#FB8500"/>
                        <circle cx="285" cy="80" r="2" fill="#FB8500"/>
                        <circle cx="290" cy="115" r="2" fill="#FB8500"/>
                        <circle cx="250" cy="135" r="2" fill="#FB8500"/>
                        <path d="M 240 95 Q 248 90, 255 96" fill="none" stroke="#2F1F17" stroke-width="3" stroke-linecap="round"/>
                        <path d="M 270 95 Q 278 90, 285 96" fill="none" stroke="#2F1F17" stroke-width="3" stroke-linecap="round"/>
                        <path d="M 253 108 Q 262 120, 270 108 Z" fill="#D00000" stroke="#2F1F17" stroke-width="2"/>
                        <ellipse cx="238" cy="102" rx="5" ry="3" fill="#FFB5A7"/>
                        <ellipse cx="288" cy="102" rx="5" ry="3" fill="#FFB5A7"/>
                        <path d="M 225 112 Q 195 112, 190 122" fill="none" stroke="#FB8500" stroke-width="4" stroke-linecap="round"/>
                        <path d="M 245 150 Q 242 165, 248 165" fill="none" stroke="#FB8500" stroke-width="4" stroke-linecap="round"/>
                        <path d="M 275 148 Q 278 163, 272 163" fill="none" stroke="#FB8500" stroke-width="4" stroke-linecap="round"/>
                    </g>
                </svg>
            </div>
            <div class="text-left md:text-center">
                <h1 class="text-xl md:text-4xl font-black font-serif-tc text-amber-950 tracking-widest">下一餐吃什麼～</h1>
                <p class="hidden md:block text-sm md:text-base text-stone-500 font-medium mt-1 tracking-wide">珍珍與雞排君，用溫度撫慰你的選擇障礙 ✨</p>
            </div>
        </div>
    </header>

    <!-- 主要內容區區塊 -->
    <main class="max-w-6xl w-full mx-auto flex-1 grid grid-cols-1 md:grid-cols-12 gap-4 p-3 md:p-6">
        
        <!-- 左側：心靈聊天視窗 -->
        <section class="md:col-span-5 bg-white rounded-2xl border border-stone-100 shadow-sm flex flex-col h-[400px] md:h-[680px]">
            <div id="chatHistory" class="flex-1 p-4 overflow-y-auto space-y-4 flex flex-col">
                <div class="flex items-start gap-2.5 animate-fade-in">
                    <div class="w-8 h-8 rounded-full bg-[#FFE5D9] flex items-center justify-center text-xs shadow-inner shrink-0">🧋</div>
                    <div class="bg-stone-50 border border-stone-100 rounded-2xl rounded-tl-none p-3 max-w-[85%] text-sm md:text-base font-medium leading-relaxed tracking-wide text-stone-800">
                        嗨！終於等到你了～肚子空空的滋味很難受吧？別擔心，我和雞排君會幫你找到最完美的下一餐！
                    </div>
                </div>
            </div>

            <!-- 下方互動操作按鈕與選項區 -->
            <div id="interactionArea" class="p-4 border-t border-stone-50 bg-[#FFFDF9] rounded-b-2xl">
                <div id="optionsContainer" class="grid grid-cols-1 gap-2"></div>
                
                <!-- 備案自選核取機制 -->
                <div id="backupContainer" class="hidden border-t border-stone-100 pt-3 mt-2">
                    <p class="text-xs font-bold text-stone-400 mb-2.5 text-center tracking-wider">✨ 如果有需要，可以額外勾選保底備案：</p>
                    <div class="flex justify-around items-center bg-white p-3 rounded-xl border border-stone-100 shadow-sm">
                        <label class="flex items-center gap-2 text-sm md:text-base font-bold text-stone-600 cursor-pointer select-none tracking-wide">
                            <input type="checkbox" id="checkFridge" class="w-4 h-4 md:w-5 md:h-5 accent-[#FFB5A7]"> 清冰箱料理
                        </label>
                        <label class="flex items-center gap-2 text-sm md:text-base font-bold text-stone-600 cursor-pointer select-none tracking-wide">
                            <input type="checkbox" id="checkStore" class="w-4 h-4 md:w-5 md:h-5 accent-[#FFB5A7]"> 便利商店
                        </label>
                    </div>
                    <button onclick="confirmAndLoadWheel()" class="w-full mt-3 py-3 bg-[#D4A373] text-white font-bold rounded-xl shadow-md hover:bg-[#C39364] transition-all text-sm md:text-base font-serif-tc tracking-widest">
                        🥰 確認並載入轉盤
                    </button>
                </div>
            </div>
        </section>

        <!-- 右側：物理命運轉盤與候選清單 -->
        <section id="wheelSection" class="md:col-span-7 flex flex-col items-center justify-center gap-4 bg-white rounded-2xl border border-stone-100 shadow-sm p-4 md:p-6">
            
            <!-- 轉盤本體容器 -->
            <div class="relative w-full max-w-[260px] md:max-w-[340px] aspect-square flex items-center justify-center">
                <div class="absolute -top-1.5 z-20 w-0 h-0 border-l-[10px] md:border-l-[14px] border-l-transparent border-r-[10px] md:border-r-[14px] border-r-transparent border-t-[20px] md:border-t-[26px] border-t-[#FB8500] drop-shadow-sm"></div>
                <canvas id="wheelCanvas" width="340" height="340" class="w-full h-full rounded-full border-4 border-[#FFF3CD] shadow-md transition-transform duration-75"></canvas>
                <div class="absolute w-7 h-7 md:w-9 md:h-9 rounded-full bg-white border-4 border-[#D4A373] shadow-inner z-10"></div>
            </div>

            <!-- 控制旋轉按鈕 -->
            <button id="spinBtn" disabled onclick="spinWheel()" class="px-8 py-3 bg-stone-200 text-stone-400 font-black font-serif-tc rounded-full shadow-md cursor-not-allowed transition-all text-sm md:text-lg tracking-widest">
                請先完成心靈對話 🔮
            </button>
            
            <div id="loadedBadge" class="hidden text-xs px-3 py-1 bg-[#E2F0CB] text-[#5A7234] rounded-full font-bold tracking-wide"></div>

            <!-- 今日精選候選名單看板 -->
            <div id="candidateCard" class="hidden w-full max-w-[420px] bg-[#FFFDF9] border border-[#FCE8A6] rounded-xl p-3 shadow-sm animate-fade-in mt-1 text-center">
                <p class="text-xs font-black font-serif-tc text-[#D4A373] mb-2 tracking-widest">✨ 珍珍與雞排君為你精選的「口袋名單」 ✨</p>
                <div id="candidateList" class="flex flex-wrap justify-center gap-1.5 max-h-[90px] overflow-y-auto p-0.5"></div>
                <p class="text-[10px] md:text-[11px] text-stone-400 mt-2 tracking-wide">（這些都是高度符合你當下需求的美味，轉到誰都超讚喔！）</p>
            </div>
        </section>

    </main>

    <!-- 頁尾 -->
    <footer class="py-3 text-center text-[10px] md:text-xs text-stone-400 border-t border-stone-100 bg-white font-medium tracking-wide">
        © 2026 下一餐吃什麼～日系美食顧問・硬核預算過濾版
    </footer>

    <script>
        const foodDatabase = {
            breakfast: [
                { name: "傳統豆漿油條", price: 1, hunger: 2, meat: 1 },
                { name: "古早味粉漿蛋餅", price: 1, hunger: 2, meat: 2 },
                { name: "中式飯糰", price: 1, hunger: 2, meat: 2 },
                { name: "傳統乾麵黑白切", price: 1, hunger: 2, meat: 2 },
                { name: "連鎖美式早點", price: 1, hunger: 2, meat: 2 },
                { name: "炭烤吐司專賣店", price: 1, hunger: 2, meat: 2 },
                { name: "現烤貝果可頌堡", price: 2, hunger: 2, meat: 1 },
                { name: "質感早午餐", price: 3, hunger: 2, meat: 2 },
                { name: "鐵板麵大冰奶", price: 1, hunger: 3, meat: 2 },
                { name: "超商現烤麵包", price: 1, hunger: 1, meat: 1 },
                { name: "中式粥品", price: 1, hunger: 2, meat: 2 },
                { name: "中式水餃", price: 1, hunger: 2, meat: 3 }
            ],
            lunch: [
                { name: "火鍋", price: 3, hunger: 3, meat: 3 },
                { name: "牛肉麵", price: 2, hunger: 3, meat: 3 },
                { name: "牛排", price: 3, hunger: 3, meat: 3 },
                { name: "港式料理", price: 3, hunger: 2, meat: 2 },
                { name: "炒飯", price: 1, hunger: 2, meat: 2 },
                { name: "中式料理", price: 2, hunger: 2, meat: 2 },
                { name: "泰式料理", price: 3, hunger: 2, meat: 2 },
                { name: "酸菜魚", price: 3, hunger: 3, meat: 3 },
                { name: "黃燜雞", price: 2, hunger: 3, meat: 3 },
                { name: "日式料理", price: 3, hunger: 2, meat: 2 },
                { name: "生魚片", price: 3, hunger: 1, meat: 3 },
                { name: "吃到飽", price: 3, hunger: 3, meat: 3 },
                { name: "網美餐廳", price: 3, hunger: 2, meat: 2 },
                { name: "速食店", price: 2, hunger: 2, meat: 3 },
                { name: "燒烤店", price: 3, hunger: 3, meat: 3 },
                { name: "咖啡店", price: 2, hunger: 1, meat: 1 },
                { name: "路邊小吃", price: 1, hunger: 2, meat: 2 },
                { name: "客家料理", price: 2, hunger: 2, meat: 3 },
                { name: "中式燒臘", price: 2, hunger: 3, meat: 3 },
                { name: "南洋雞飯", price: 2, hunger: 2, meat: 3 },
                { name: "日式丼飯", price: 2, hunger: 2, meat: 3 },
                { name: "鴨肉飯", price: 1, hunger: 2, meat: 3 },
                { name: "中式粥品", price: 1, hunger: 2, meat: 2 },
                { name: "中式水餃", price: 1, hunger: 2, meat: 3 },
                { name: "素食料理", price: 2, hunger: 2, meat: 1 }
            ],
            dinner: []
        };
        
        foodDatabase.dinner = [...foodDatabase.lunch, 
            { name: "鹹酥雞", price: 2, hunger: 2, meat: 3 },
            { name: "鹽水雞", price: 2, hunger: 1, meat: 2 },
            { name: "夜市小吃", price: 2, hunger: 2, meat: 3 },
            { name: "韓式炸雞", price: 3, hunger: 2, meat: 3 }
        ];

        const questions = [
            {
                text: "【餐期確認】今天想和我們一起度過哪一餐呢？",
                key: "meal",
                options: [
                    { label: "早餐 ☀️", value: "breakfast" },
                    { label: "午餐 🍛", value: "lunch" },
                    { label: "晚餐 🌙", value: "dinner" }
                ]
            },
            {
                text: "【飢餓程度】現在肚子有多餓呢？",
                key: "hunger",
                options: [
                    { label: "嘴饞微餓 🥗 (輕食點心)", value: 1 },
                    { label: "剛剛好 🍱 (常規飽腹)", value: 2 },
                    { label: "能吃下一頭牛 🥩 (大份量多澱粉)", value: 3 }
                ]
            },
            {
                text: "【口味與肉量】當下最想念哪種滿足感呢？",
                key: "meat",
                options: [
                    { label: "清淡暖胃 / 想吃素 🥬", value: 1 },
                    { label: "鹹香濃郁 / 肉菜均衡 🥢", value: 2 },
                    { label: "想大口吃肉 / 無肉不歡 🍖", value: 3 },
                    { label: "想要甜滋滋的療癒 🍰", value: "sweet" }
                ]
            },
            {
                text: "【用餐人數】今天是幾個人一起享受美食呢？",
                key: "people",
                options: [
                    { label: "享受孤獨單身 🙋‍♂️", value: "single" },
                    { label: "甜蜜雙人 👩‍❤️‍👨", value: "double" },
                    { label: "溫馨多人 👨‍👩‍👧‍👦", value: "multi" }
                ]
            },
            {
                text: "【預算考量】今天的荷包心情如何？",
                key: "price",
                options: [
                    { label: "銅板省錢 🪙 (<$100)", value: 1 },
                    { label: "正常消費 💵 ($100-$250)", value: 2 },
                    { label: "偶爾奢華一下 💎 (>$250)", value: 3 }
                ]
            },
            {
                text: "【出門意願】最後一題～今天願意走多遠去尋找美食？",
                key: "distance",
                options: [
                    { label: "只想在巷口 🚶", value: "close" },
                    { label: "10分鐘路程 🚴", value: "mid" },
                    { label: "展開美食大冒險 🚗", value: "far" }
                ]
            }
        ];

        let currentQuestionStep = 0;
        let userAnswers = {};
        let selectedFoodPool = [];

        const canvas = document.getElementById("wheelCanvas");
        const ctx = canvas.getContext("2d");
        const pastelColors = ["#FFDFD3", "#E2F0CB", "#B5E2FA", "#FBC4AB", "#C5A3FF", "#FFC6FF", "#FFEDA6", "#D8E2DC", "#FFE5D9", "#ECE4DB"];
        let isSpinning = false;
        let currentAngle = 0;

        window.onload = () => {
            renderQuestion();
            drawEmptyWheel();
        };

        function renderQuestion() {
            const container = document.getElementById("optionsContainer");
            container.innerHTML = "";

            if (currentQuestionStep < questions.length) {
                const q = questions[currentQuestionStep];
                addChatBubble("bot", q.text);

                q.options.forEach(opt => {
                    const btn = document.createElement("button");
                    btn.className = "w-full text-left py-2.5 px-4 bg-white border-2 border-stone-100 hover:border-[#FFB5A7] rounded-xl hover:bg-[#FFFDF9] transition-all text-sm md:text-lg font-bold shadow-sm animate-fade-in text-stone-800 tracking-wide";
                    btn.innerText = opt.label;
                    btn.onclick = () => selectOption(q.key, opt);
                    container.appendChild(btn);
                });
            } else {
                addChatBubble("bot", "太棒了！心靈對話已完成，珍珍和雞排君已經感應到你的靈魂密碼囉！最後看看是否要加入保底備案呢？");
                document.getElementById("backupContainer").classList.remove("hidden");
                scrollChatToBottom();
            }
        }

        function selectOption(key, option) {
            userAnswers[key] = option.value;
            addChatBubble("user", option.label);
            
            currentQuestionStep++;
            setTimeout(() => {
                renderQuestion();
            }, 300);
        }

        function addChatBubble(sender, text) {
            const chatHistory = document.getElementById("chatHistory");
            const wrapper = document.createElement("div");
            wrapper.className = `flex items-start gap-2.5 max-w-[90%] text-sm md:text-lg font-medium leading-relaxed tracking-wide ${sender === 'user' ? 'self-end flex-row-reverse' : 'self-start'}`;
            
            const avatar = sender === 'bot' ? '🧋' : '😋';
            const bgClass = sender === 'bot' ? 'bg-stone-50 border border-stone-100 rounded-tl-none text-stone-800' : 'bg-[#FFE5D9] text-stone-900 rounded-tr-none font-bold';

            wrapper.innerHTML = `
                <div class="w-8 h-8 rounded-full bg-white border border-stone-100 flex items-center justify-center text-xs shadow-sm shrink-0">${avatar}</div>
                <div class="${bgClass} rounded-2xl p-3 shadow-sm">${text}</div>
            `;
            chatHistory.appendChild(wrapper);
            scrollChatToBottom();
        }

        function scrollChatToBottom() {
            const chatHistory = document.getElementById("chatHistory");
            chatHistory.scrollTop = chatHistory.scrollHeight;
        }

        function confirmAndLoadWheel() {
            const targetMeal = userAnswers.meal;
            const pool = foodDatabase[targetMeal] || [];
            
            // 【核心優化一】：預算硬性過濾 (Strict Filtering) - 拒絕妥協
            let matchedItems = pool.filter(food => food.price === userAnswers.price);
            
            // 安全保底：萬一該時段的該預算「完全沒有任何食物」（例如早餐選奢華等級只剩1樣），則抓相鄰預算，確保轉盤不壞掉
            if (matchedItems.length < 3) {
                const backups = pool.filter(food => food.price === (userAnswers.price - 1) || food.price === (userAnswers.price + 1));
                matchedItems = [...matchedItems, ...backups];
            }

            // 【核心優化二】：在絕對符合預算的群組內，再根據飢餓度與肉量精確計分
            let scoredPool = matchedItems.map(food => {
                let score = 0;
                if (food.hunger === userAnswers.hunger) score += 3;
                if (userAnswers.meat === "sweet") {
                    if (food.name === "咖啡店" || food.name === "超商現烤麵包" || food.name === "網美餐廳") score += 5;
                } else if (food.meat === userAnswers.meat) {
                    score += 3;
                }
                return { ...food, score: score };
            });

            // 依權重分數由高到低排序
            scoredPool.sort((a, b) => b.score - a.score);

            // 擷取前 6 名最精準的頂級候選
            let finalSelection = scoredPool.slice(0, 6).map(item => item.name);

            // 只有使用者手動勾選的保底備案，才允許跨越預算加入
            const hasFridge = document.getElementById("checkFridge").checked;
            const hasStore = document.getElementById("checkStore").checked;
            
            if (hasFridge) finalSelection.push("清冰箱料理");
            if (hasStore) finalSelection.push("便利商店");

            selectedFoodPool = [...new Set(finalSelection)];

            drawWheel(selectedFoodPool);
            renderCandidateList(selectedFoodPool);

            const spinBtn = document.getElementById("spinBtn");
            spinBtn.disabled = false;
            spinBtn.className = "px-10 py-3.5 bg-[#FFB5A7] text-white font-black font-serif-tc rounded-full shadow-md hover:bg-[#FCD5CE] cursor-pointer transition-all text-sm md:text-lg tracking-widest animate-pulse";
            spinBtn.innerText = "🌟 啟動命運轉盤 🌟";

            document.getElementById("backupContainer").classList.add("hidden");
            document.getElementById("optionsContainer").innerHTML = `<p class="text-xs text-center text-stone-400 py-2 font-medium tracking-wide">轉盤已就緒！請在右側進行命運大轉盤 🎉</p>`;
            
            const badge = document.getElementById("loadedBadge");
            badge.innerText = `已為你載入 ${selectedFoodPool.length} 項高匹配度美味`;
            badge.classList.remove("hidden");

            if (window.innerWidth < 768) {
                document.getElementById("wheelSection").scrollIntoView({ behavior: 'smooth', block: 'start' });
            }
        }

        function renderCandidateList(list) {
            const card = document.getElementById("candidateCard");
            const container = document.getElementById("candidateList");
            container.innerHTML = "";

            list.forEach((name, index) => {
                const badge = document.createElement("span");
                badge.className = "text-xs px-2.5 py-1 font-bold rounded-lg border border-stone-50 shadow-sm animate-fade-in tracking-wide";
                badge.style.backgroundColor = pastelColors[index % pastelColors.length];
                badge.style.color = "#292524";
                badge.innerText = name;
                container.appendChild(badge);
            });

            card.classList.remove("hidden");
        }

        function drawEmptyWheel() {
            const radius = canvas.width / 2;
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.beginPath();
            ctx.arc(radius, radius, radius - 10, 0, 2 * Math.PI);
            ctx.fillStyle = "#FDFBF7";
            ctx.fill();
            ctx.lineWidth = 2;
            ctx.strokeStyle = "#E7E5E4";
            ctx.stroke();
            
            ctx.fillStyle = "#A8A29E";
            ctx.font = "bold 15px 'Noto Sans TC', sans-serif";
            ctx.textAlign = "center";
            ctx.fillText("完成對話後自動生成扇區", radius, radius + 5);
        }

        function drawWheel(list) {
            const numSlices = list.length;
            const radius = canvas.width / 2;
            const sliceAngle = (2 * Math.PI) / numSlices;

            ctx.clearRect(0, 0, canvas.width, canvas.height);

            for (let i = 0; i < numSlices; i++) {
                const angle = currentAngle + i * sliceAngle;
                
                ctx.beginPath();
                ctx.moveTo(radius, radius);
                ctx.arc(radius, radius, radius - 6, angle, angle + sliceAngle);
                ctx.closePath();
                ctx.fillStyle = pastelColors[i % pastelColors.length];
                ctx.fill();
                ctx.lineWidth = 1.5;
                ctx.strokeStyle = "#FFFFFF";
                ctx.stroke();

                ctx.save();
                ctx.translate(radius, radius);
                ctx.rotate(angle + sliceAngle / 2);
                ctx.textAlign = "right";
                ctx.fillStyle = "#292524";
                
                const fontSize = numSlices > 8 ? "13px" : "15px";
                ctx.font = `bold ${fontSize} 'Noto Sans TC', sans-serif`;
                ctx.fillText(list[i], radius - 28, 6);
                ctx.restore();
            }
        }

        function spinWheel() {
            if (isSpinning || selectedFoodPool.length === 0) return;
            isSpinning = true;
            
            const spinBtn = document.getElementById("spinBtn");
            spinBtn.disabled = true;
            spinBtn.className = "px-10 py-3.5 bg-stone-200 text-stone-400 font-black font-serif-tc rounded-full shadow-inner cursor-not-allowed text-sm tracking-widest";
            spinBtn.innerText = "命運旋轉中...";

            const totalFrames = 180;
            let currentFrame = 0;
            const startRotation = currentAngle;
            const extraRotation = 6 * 2 * Math.PI + Math.random() * 2 * Math.PI; 

            function animate() {
                currentFrame++;
                const t = currentFrame / totalFrames;
                const easeOutCubic = 1 - Math.pow(1 - t, 3);
                currentAngle = startRotation + extraRotation * easeOutCubic;

                drawWheel(selectedFoodPool);

                if (currentFrame < totalFrames) {
                    requestAnimationFrame(animate);
                } else {
                    isSpinning = false;
                    determineWinner();
                }
            }
            requestAnimationFrame(animate);
        }

        function determineWinner() {
            const numSlices = selectedFoodPool.length;
            const sliceAngle = (2 * Math.PI) / numSlices;
            
            let normalizedAngle = (1.5 * Math.PI - currentAngle) % (2 * Math.PI);
            if (normalizedAngle < 0) normalizedAngle += 2 * Math.PI;

            const winnerIndex = Math.floor(normalizedAngle / sliceAngle) % numSlices;
            const winnerName = selectedFoodPool[winnerIndex];

            let blessingText = "";
            if (winnerName === "清冰箱料理") {
                blessingText = `✨ 雞排君眨眨眼說：『太好了，是【清冰箱料理】！這可是開啟個人主廚模式的大好機會：<br>1. 翻出角落所有的剩餘食材。<br>2. 發揮創意來個溫馨大雜燴炒飯或暖心煮麵。<br>3. 懷著感恩的心把它們吃光！動手變出專屬自己熱騰騰的暖心一餐吧！』`;
            } else if (winnerName === "便利商店") {
                blessingText = `🏪 珍珍歪頭微笑：『選中了萬能的【便利商店】！這代表著生活裡最貼心、最穩定的陪伴。珍珍偷偷推薦你：挑選一盒剛出爐的微波熱騰騰主食，再搭配一顆散發濃郁茶香的茶葉蛋，簡單補給也是最確定的幸福喔！』`;
            } else if (winnerName === "素食料理") {
                blessingText = `🥬 珍珍用溫柔似水的眼神看著你：『指針停在了【素食料理】。這一定是心靈發出的純淨訊號！今晚來點翠綠鮮甜的清炒時蔬、溫潤甘甜的蔬果高湯吧，清新且完全沒有負擔的美味，能好好撫慰你疲憊的一天。』`;
            } else if (winnerName === "火鍋" || winnerName === "酸菜魚") {
                blessingText = `🍲 珍珍和雞排君一起拍手歡呼：『大獎揭曉～是讓人熱血沸騰的【${winnerName}】！想像一下，鮮嫩的肉片在滾燙的湯底裡歡快翻滾，白色的煙霧徐徐升騰，香氣鋪鼻。這絕對是熱量與靈魂的雙重極致治癒！快出發吧！』`;
            } else if (winnerName === "中式燒臘" || winnerName === "牛排" || winnerName === "韓式炸雞") {
                blessingText = `🍖 雞排君興奮得閃閃發光：『天啊！是讓人垂涎三尺的【${winnerName}】！光是想到油亮酥脆的外皮在砧板上發出誘人聲響，或是飽滿多汁的肉塊在嘴裡綻放脂香，口水就忍不住啦！這是你今天努力應得的極致奢華犒賞！』`;
            } else {
                blessingText = `✨ 珍珍與雞排君靠在一起對你說：『命運的指針選擇了【${winnerName}】！這一定是命中注定的緣分。看著它熱氣騰騰上桌的模樣，一口咬下，將今天所有的煩惱和疲憊通通融化吧！祝你用餐愉快，身心都飽飽的喔～』`;
            }

            if (window.innerWidth < 768) {
                window.scrollTo({ top: 0, behavior: 'smooth' });
            }

            addChatBubble("bot", `🎉 叮咚！轉盤結果出爐囉！<br><br>我們今晚為你選中的靈魂美食是：<br><strong class="block text-2xl md:text-4xl font-serif-tc text-amber-950 font-black my-2.5 tracking-widest">${winnerName}</strong><br>${blessingText}`);

            const optionsContainer = document.getElementById("optionsContainer");
            optionsContainer.innerHTML = `
                <button onclick="resetApp()" class="w-full py-3 bg-[#E2F0CB] text-[#5A7234] font-extrabold rounded-xl shadow-sm hover:bg-[#D4E8B7] transition-all text-sm md:text-lg tracking-wider font-serif-tc">
                    🔄 重新測驗 / 再玩一次
                </button>
            `;
        }

        function resetApp() {
            currentQuestionStep = 0;
            userAnswers = {};
            selectedFoodPool = [];
            isSpinning = false;
            
            document.getElementById("chatHistory").innerHTML = `
                <div class="flex items-start gap-2.5 animate-fade-in">
                    <div class="w-8 h-8 rounded-full bg-[#FFE5D9] flex items-center justify-center text-sm shadow-inner shrink-0">🧋</div>
                    <div class="bg-stone-50 border border-stone-100 rounded-2xl rounded-tl-none p-3 max-w-[85%] text-sm md:text-base font-medium leading-relaxed tracking-wide text-stone-800">
                        重新出發！這次你的靈魂想吃點什麼呢？珍珍和雞排君都在這裡陪你唷。
                    </div>
                </div>
            `;
            
            document.getElementById("loadedBadge").classList.add("hidden");
            document.getElementById("candidateCard").classList.add("hidden");
            
            const spinBtn = document.getElementById("spinBtn");
            spinBtn.disabled = true;
            spinBtn.className = "px-10 py-3 bg-stone-200 text-stone-400 font-black font-serif-tc rounded-full shadow-md cursor-not-allowed transition-all text-sm md:text-lg tracking-widest";
            spinBtn.innerText = "請先完成心靈對話 🔮";
            
            document.getElementById("checkFridge").checked = false;
            document.getElementById("checkStore").checked = false;

            renderQuestion();
            drawEmptyWheel();
        }
    </script>
</body>
</html>
