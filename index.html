    .bubble { animation: bubbleIn .35s cubic-bezier(.22, .9, .22, 1.18); }
    @keyframes bubbleIn {
      from { opacity: 0; transform: translateY(10px) scale(.97); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }
    .mascot-float { animation: mascotFloat 4.8s ease-in-out infinite; transform-origin: 50% 60%; }
    @keyframes mascotFloat {
      0%, 100% { transform: translateY(0) rotate(-.4deg); }
      50% { transform: translateY(-9px) rotate(.7deg); }
    }
    .sparkle-twinkle { animation: twinkle 2.2s ease-in-out infinite; transform-origin: center; }
    .sparkle-twinkle:nth-child(2) { animation-delay: .3s; }
    .sparkle-twinkle:nth-child(3) { animation-delay: .65s; }
    @keyframes twinkle {
      0%,100% { opacity: .48; transform: scale(.92); }
      50% { opacity: 1; transform: scale(1.08); }
    }
    .float-heart, .paper-flower {
      position: fixed;
      pointer-events: none;
      z-index: 1;
      opacity: .58;
    }
    .float-heart {
      width: 13px;
      height: 13px;
      background: #f7c8c9;
      transform: rotate(45deg);
      animation: heartUp 10s linear infinite;
    }
    .float-heart:before, .float-heart:after {
      content: "";
      position: absolute;
      width: 13px;
      height: 13px;
      background: #f7c8c9;
      border-radius: 50%;
    }
    .float-heart:before { left: -6.5px; }
    .float-heart:after { top: -6.5px; }
    @keyframes heartUp {
      0% { transform: translateY(108vh) rotate(45deg); opacity: 0; }
      15% { opacity: .54; }
      100% { transform: translateY(-14vh) rotate(45deg); opacity: 0; }
    }
    .paper-flower {
      width: 16px;
      height: 16px;
      animation: flowerFall 13s linear infinite;
    }
    .paper-flower:before, .paper-flower:after {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: 80% 20% 80% 20%;
      background: rgba(255, 241, 184, .74);
      transform: rotate(45deg);
    }
    .paper-flower:after {
      background: rgba(247, 217, 196, .78);
      transform: rotate(-45deg);
    }
    @keyframes flowerFall {
      0% { transform: translate3d(0,-12vh,0) rotate(0deg); opacity: 0; }
      12% { opacity: .72; }
      100% { transform: translate3d(44px,112vh,0) rotate(420deg); opacity: 0; }
    }
    .option-btn {
      transition: transform .18s ease, box-shadow .18s ease, background .18s ease;
    }
    .option-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 13px 28px rgba(120, 86, 62, .14);
    }
    .wheel-aura:before {
      content: "";
      position: absolute;
      inset: -18px;
      border-radius: 999px;
      background: conic-gradient(from 0deg, rgba(255,241,184,.12), rgba(247,200,201,.5), rgba(246,232,216,.2), rgba(255,241,184,.64), rgba(255,241,184,.12));
      filter: blur(20px);
      animation: auraSpin 5s linear infinite;
      opacity: .78;
    }
    @keyframes auraSpin { to { transform: rotate(360deg); } }
    .modal-in { animation: modalIn .42s cubic-bezier(.22,.9,.22,1.12); }
    @keyframes modalIn {
      from { opacity: 0; transform: translateY(16px) scale(.96); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }
    input[type="checkbox"] { accent-color: #b88b64; }
  </style>

    const state = { step:0, answers:{}, candidates:[], wheelRotation:0, spinning:false, winner:null, particles:[] };

    function renderQuestion() {

    function renderFallback() {
      addMessage("bot", "最後，留一盞小小的備案燈。要不要把清冰箱料理或便利商店也放進轉盤裡？不勾也很好，今天就照心情走。");

      document.getElementById("confirmFallback").onclick = () => {
        const fallbacks = [];

    function prepareCandidates(fallbacks) {
      const groupBoost = ["火鍋", "燒烤店", "吃到飽", "中式料理"];
      const sweetBoost = ["咖啡店", "超商現烤麵包", "現烤貝果可頌堡", "質感早午餐"];
      const ranked = foodDatabase
        .filter(food => food.meal === state.answers.meal)
        .map((food, index) => {
          let score = 0;
          if (food.hunger === state.answers.hunger) score += 4;
          if (food.meat === state.answers.meat) score += 4;
          if (food.price === state.answers.price) score += 3;
          if (state.answers.people === "group" && groupBoost.includes(food.name)) score += 2;
          if (state.answers.sweet && sweetBoost.includes(food.name)) score += 3;
          return { ...food, score, index };
        })
        .sort((a, b) => b.score - a.score || a.price - b.price || a.index - b.index);

      const top = [];
      const seen = new Set();
      for (const food of ranked) {
        if (!seen.has(food.name)) {
          top.push(food);
          seen.add(food.name);
        }
        if (top.length === 5) break;
      }
      fallbacks.forEach(name => top.push({ name, meal: state.answers.meal, price: 1, hunger: state.answers.hunger, meat: state.answers.meat, score: 5 }));
      state.candidates = top;
      state.winner = null;
      addMessage("bot", "好，香氣已經排成一圈了。等你按下轉盤，珍珍和雞排君會把最適合現在的那一口，輕輕送到你面前。");
      inputArea.innerHTML = `<button id="restartChat" class="w-full rounded-full bg-white/80 px-5 py-3 font-semibold text-hojicha shadow-tiny transition hover:bg-custard dark:bg-[#4a4038] dark:text-[#fff1df]">重新聊天選一次</button>`;
      document.getElementById("restartChat").onclick = resetAll;
      spinBtn.disabled = false;
      wheelHint.textContent = "候選名單已完成，按下按鈕讓香氣開始旋轉。";
      document.getElementById("againTop").classList.remove("hidden");
      drawWheel();
    }

    function drawWheel(rotation = state.wheelRotation) {
      const w = wheel.width;
      const h = wheel.height;
      const cx = w / 2;
      const cy = h / 2;
      const r = w * .43;
      ctx.clearRect(0, 0, w, h);
      ctx.save();
      ctx.translate(cx, cy);
      ctx.rotate(rotation);
      const items = state.candidates.length ? state.candidates : [{name:"豆漿油條"},{name:"暖胃粥品"},{name:"日式丼飯"},{name:"火鍋"},{name:"咖啡店"},{name:"鹹酥雞"}];
      const seg = Math.PI * 2 / items.length;
      for (let i = 0; i < items.length; i++) {
        ctx.beginPath();
        ctx.moveTo(0,0);
        ctx.arc(0,0,r,i*seg,(i+1)*seg);
        ctx.closePath();
        ctx.fillStyle = palette[i % palette.length];
        ctx.fill();
        ctx.strokeStyle = "rgba(255,255,255,.82)";
        ctx.lineWidth = 6;
        ctx.stroke();
        ctx.save();
        ctx.rotate(i * seg + seg / 2);
        ctx.textAlign = "right";
        ctx.textBaseline = "middle";
        ctx.fillStyle = "#5f5046";
        ctx.font = `700 ${items.length > 6 ? 30 : 36}px "Noto Sans TC","Microsoft JhengHei",sans-serif`;
        wrapWheelText(items[i].name, r - 40, 0, Math.max(76, r * .29), items.length > 6 ? 32 : 38);
        ctx.restore();
      }
      ctx.beginPath();
      ctx.arc(0,0,r*.19,0,Math.PI*2);
      ctx.fillStyle = "#FFFDF7";
      ctx.fill();
      ctx.lineWidth = 8;
      ctx.strokeStyle = "#B88B64";
      ctx.stroke();
      ctx.beginPath();
      ctx.arc(0,0,r*.08,0,Math.PI*2);
      ctx.fillStyle = "#F7C8C9";
      ctx.fill();
      ctx.restore();
      ctx.save();
      ctx.globalAlpha = .22;
      ctx.beginPath();
      ctx.arc(cx, cy, r + 18, 0, Math.PI * 2);
      ctx.strokeStyle = "#FFF1B8";
      ctx.lineWidth = 24;
      ctx.stroke();
      ctx.restore();
    }

    function wrapWheelText(text, x, y, maxWidth, lineHeight) {
      const lines = [];
      let line = "";
      for (const char of [...text]) {
        const test = line + char;
        if (ctx.measureText(test).width > maxWidth && line) {
          lines.push(line);
          line = char;
        } else {
          line = test;
        }
      }
      if (line) lines.push(line);
      const start = y - (lines.length - 1) * lineHeight / 2;
      lines.slice(0, 3).forEach((ln, i) => ctx.fillText(ln, x, start + i * lineHeight));
    }

    function cubicOut(t) { return 1 - Math.pow(1 - t, 3); }

    function selectWinner() {
      const weights = state.candidates.map((food, index) => Math.max(1, food.score) + Math.max(0, 5 - index));
      const total = weights.reduce((sum, n) => sum + n, 0);
      let pick = Math.random() * total;
      for (let i = 0; i < weights.length; i++) {
        pick -= weights[i];
        if (pick <= 0) return i;
      }
      return 0;
    }

    function spinWheel() {
      if (state.spinning || !state.candidates.length) return;
      state.spinning = true;
      spinBtn.disabled = true;
      wheelHint.textContent = "轉盤正在把晚風、香氣和一點點運氣攪在一起。";
      const winnerIndex = selectWinner();
      const n = state.candidates.length;
      const seg = Math.PI * 2 / n;
      const pointerAngle = -Math.PI / 2;
      const centerAngle = winnerIndex * seg + seg / 2;
      const current = state.wheelRotation % (Math.PI * 2);
      let target = pointerAngle - centerAngle;
      while (target < current) target += Math.PI * 2;
      target += Math.PI * 2 * 8 + Math.PI * 2 * Math.floor(Math.random() * 3);
      const start = state.wheelRotation;
      const duration = 5200;
      const t0 = performance.now();
      function frame(now) {
        const p = Math.min(1, (now - t0) / duration);
        let eased;
        if (p < .33) eased = cubicOut(p / .33) * .52;
        else if (p < .72) eased = .52 + cubicOut((p - .33) / .39) * .34;
        else eased = .86 + cubicOut((p - .72) / .28) * .14;
        state.wheelRotation = start + (target - start) * eased;
        drawWheel();
        burstParticles(p);
        drawParticles();
        if (p < 1) requestAnimationFrame(frame);
        else {
          state.wheelRotation = target % (Math.PI * 2);
          state.winner = state.candidates[winnerIndex];
          drawWheel();
          state.spinning = false;
          showResult(state.winner);
        }
      }
      requestAnimationFrame(frame);
    }

    function burstParticles(progress) {
      if (Math.random() < .8) {
        const angle = Math.random() * Math.PI * 2;
        const radius = 230 + Math.random() * 170;
        state.particles.push({
          x: 450 + Math.cos(angle) * radius,
          y: 450 + Math.sin(angle) * radius,
          vx: Math.cos(angle) * (1 + Math.random() * 2),
          vy: Math.sin(angle) * (1 + Math.random() * 2),
          life: 35 + Math.random() * 35,
          size: 3 + Math.random() * 6,
          color: Math.random() > .5 ? "#FFF1B8" : "#F7C8C9"
        });
      }
      if (progress > .96 && Math.random() < .35) {
        for (let i = 0; i < 6; i++) {
          state.particles.push({ x:450, y:450, vx:(Math.random()-.5)*10, vy:(Math.random()-.5)*10, life:45, size:4+Math.random()*7, color:["#FFF1B8","#F7C8C9","#F7D9C4","#FFFDF7"][i%4] });
        }
      }
    }

    function drawParticles() {
      fctx.clearRect(0, 0, fx.width, fx.height);
      for (let i = state.particles.length - 1; i >= 0; i--) {
        const p = state.particles[i];
        p.x += p.vx;
        p.y += p.vy;
        p.vy += .03;
        p.life -= 1;
        fctx.save();
        fctx.globalAlpha = Math.max(0, p.life / 60);
        fctx.translate(p.x, p.y);
        fctx.rotate(p.life * .15);
        fctx.fillStyle = p.color;
        fctx.beginPath();
        fctx.moveTo(0, -p.size);
        fctx.lineTo(p.size * .38, -p.size * .38);
        fctx.lineTo(p.size, 0);
        fctx.lineTo(p.size * .38, p.size * .38);
        fctx.lineTo(0, p.size);
        fctx.lineTo(-p.size * .38, p.size * .38);
        fctx.lineTo(-p.size, 0);
        fctx.lineTo(-p.size * .38, -p.size * .38);
        fctx.closePath();
        fctx.fill();
        fctx.restore();
        if (p.life <= 0) state.particles.splice(i, 1);
      }
    }

    function resultCopy(name) {
      if (name === "火鍋") return "今晚就讓火鍋收留你吧。薄薄的肉片在湯中翻滾，像被熱氣溫柔抱住，蔬菜慢慢釋出甜味，豆皮吸飽湯汁。每一口都不急，先聽湯滾，再把心裡的疲憊一起煮軟。";

      if (name === "素食料理") return "今天可以把身體交給素食料理。鮮甜蔬菜在高湯裡舒展，菇類帶著溫和香氣，豆腐柔柔接住味道。吃起來不張揚，卻像一碗乾淨的月光，替肚子和心情都留一點清亮。";
      if (name === "清冰箱料理") return "清冰箱料理是今晚的小魔法。把剩下的食材重新組合，不必追求華麗，只要熱起來、香起來、有人好好吃完它，就已經是一頓很有生活感的晚餐。";
      if (name === "便利商店") return "便利商店也能是一盞溫柔的夜燈。茶葉蛋有安定的滷香，關東煮在熱湯裡慢慢冒氣，再配一杯熱飲，簡單卻可靠。今晚不用為難自己，先讓胃暖起來就好。";
      const scenes = {
        "傳統豆漿油條":"熱豆漿冒著細細白煙，油條酥脆地靠在碗邊，清晨的光像棉被一樣軟。","古早味粉漿蛋餅":"粉漿蛋餅帶著微微焦香，邊緣軟中有脆，醬油膏慢慢化開，是很台式的早安。","中式飯糰":"飯糰握得紮實，油條、肉鬆和酸菜藏在裡頭，每一口都像把早晨收進掌心。","傳統乾麵黑白切":"乾麵拌開醬香，黑白切安靜躺在小盤裡，簡單卻很有老店的穩定感。","連鎖美式早點":"蛋香、吐司和溫熱飲料排在桌上，是不用思考也能被照顧的一餐。","炭烤吐司專賣店":"炭烤吐司有淡淡煙香，奶油在熱度裡融化，鹹甜交錯得像慢慢醒來的城市。","現烤貝果可頌堡":"現烤麵香鬆鬆散開，貝果或可頌夾著清爽餡料，像把一小段假日放進盤子。","質感早午餐":"木盤、嫩蛋、沙拉和烤麵包排得漂亮，今天適合慢一點，讓自己吃得像被好好款待。","鐵板麵大冰奶":"鐵板麵熱呼呼地裹著醬，旁邊一杯大冰奶透著涼意，飽足感直接又可愛。","超商現烤麵包":"剛出爐的麵包帶著奶油香，便利卻不敷衍，咬下去有一點甜甜的安慰。","中式粥品":"粥品溫柔地包住胃，米粒煮到柔軟，配一點鹹香小菜，整個人都會安靜下來。","中式水餃":"水餃圓鼓鼓地盛在盤裡，咬開有熱氣和肉汁，是很家常、也很可靠的幸福。","牛肉麵":"牛肉麵的湯頭沉穩厚實，麵條掛著香氣，牛肉軟而有力，像替今天補上一口勇氣。","牛排":"熱鐵板滋滋作響，牛排香氣往上竄，今晚可以稍微隆重一點，讓自己被飽足感照亮。","港式料理":"蒸籠一掀，點心熱氣輕輕散開，蝦餃、燒賣與茶香都讓餐桌變得柔和熱鬧。","炒飯":"米飯粒粒分明，鍋氣和蛋香在盤裡交會，簡單直接，卻有一種把人餵飽的真心。","中式料理":"幾道熱菜配上白飯，鹹香、青菜與湯水剛好平衡，很適合把一天的話慢慢吃完。","泰式料理":"酸香與辛香輕輕打開胃口，香料像午後陽光一樣明亮，讓疲倦也變得有精神。","酸菜魚":"酸菜魚的湯底開胃鮮明，魚片柔嫩滑過舌尖，熱辣與酸香一起把胃叫醒。","黃燜雞":"黃燜雞醬香濃郁，雞肉與馬鈴薯吸飽湯汁，蓋在飯上就是踏踏實實的一碗滿足。","日式料理":"日式料理有乾淨的層次，飯、湯、主菜各自安靜發光，像替今天整理出一張清爽餐桌。","生魚片":"生魚片清亮細緻，入口帶著海的鮮甜，適合想輕盈一點，卻仍想被美味照顧的時刻。","吃到飽":"吃到飽像一場熱鬧小旅行，想吃什麼都能慢慢拿，今晚就把選擇權交還給胃口。","網美餐廳":"漂亮的餐盤、柔和燈光和細緻擺盤，讓這一餐不只填飽肚子，也替心情拍一張好看的照片。","速食店":"薯條熱熱脆脆，漢堡握在手裡很有份量，偶爾直接一點，也是一種爽快的療癒。","燒烤店":"烤網上的香氣一層層升起，肉片邊緣微焦，聊天聲配著炭香，夜晚自然就暖了。","咖啡店":"咖啡香慢慢落在杯緣，輕食和甜點陪在旁邊，今天可以不急著飽，只要溫柔地滿足。","路邊小吃":"路邊小吃有城市最親切的熱氣，攤燈亮著，香味飄著，簡單一份就能吃出生活的味道。","客家料理":"客家料理鹹香厚實，鑊氣與醬香都很鮮明，配白飯尤其安心，像長輩端來的招呼。","南洋雞飯":"雞飯油潤清香，雞肉嫩、醬汁亮，米飯吸著香氣，吃起來清爽卻很有存在感。","日式丼飯":"丼飯把肉香、醬汁和白飯收在同一只碗裡，扒開熱氣，就能得到一份剛剛好的飽足。","鴨肉飯":"鴨肉飯帶著淡淡煙燻香，油蔥和醬汁滲進米飯，樸實卻耐吃，越吃越安定。","鹹酥雞":"鹹酥雞剛炸好時最會安慰人，九層塔香氣一上來，外酥內嫩，整個夜晚都變得鬆了一點。","鹽水雞":"鹽水雞清爽又有嚼勁，蔬菜和雞肉拌著胡椒香，適合想吃肉卻不想太沉重的夜晚。","夜市小吃":"夜市小吃有燈光、人聲和熱騰騰的香氣，邊走邊吃，像把今晚過成一場小小散步。","韓式炸雞":"韓式炸雞裹著亮亮醬汁，甜辣和酥脆一起出現，適合把今天的悶氣咬成清脆聲響。"
      };
      const base = scenes[name] || `${name}正適合此刻，熱氣、香氣和一點點期待會慢慢聚在桌上。`;
      return `${base} 珍珍想替你倒一杯暖暖的飲料，雞排君在旁邊笑得很開心。這一餐不用完美，只要入口的那一瞬間，能讓肩膀放鬆、讓肚子點頭，就已經很好很好了。`;
    }

    function showResult(item) {
      spinBtn.disabled = false;
      wheelHint.textContent = "命運已經選好，香氣正停在你的名字旁邊。";
      addMessage("bot", `轉盤停下來了。今晚是「${item.name}」。慢慢吃，讓這一口陪你把今天收好。`);
      document.getElementById("resultTitle").textContent = item.name;
      document.getElementById("resultText").textContent = resultCopy(item.name);
      const steps = document.getElementById("specialSteps");
      steps.classList.add("hidden");
      steps.innerHTML = "";
      if (item.name === "清冰箱料理") {
        steps.classList.remove("hidden");
        steps.innerHTML = `<ol class="list-decimal space-y-2 pl-5"><li>先找一份主食：白飯、麵、吐司或冷凍水餃都可以。</li><li>再挑兩樣配角：雞蛋、青菜、菇類、罐頭或剩菜，切小一點比較快熟。</li><li>用蒜香或醬油拌炒，最後加一點胡椒或蔥花，熱熱上桌就很有家的味道。</li></ol>`;
      }
      if (item.name === "便利商店") {
        steps.classList.remove("hidden");
        steps.innerHTML = `<div class="space-y-2"><p>今晚推薦這樣配：茶葉蛋一顆、關東煮兩到三樣，再拿一杯熱飲。</p><p>有湯、有蛋白質，也有溫度，簡單但不孤單。</p></div>`;
      }
      saveHistory(item.name);
      renderHistory();
      document.getElementById("resultModal").classList.remove("hidden");
      document.getElementById("resultModal").classList.add("flex");
      scrollChat();
    }

    function saveHistory(name) {
      const history = JSON.parse(localStorage.getItem("nextMealHistory") || "[]");
      history.unshift({ name, time: new Date().toLocaleString("zh-TW", { hour12: false }) });
      localStorage.setItem("nextMealHistory", JSON.stringify(history.slice(0, 10)));
    }

    function renderHistory() {
      const list = document.getElementById("historyList");
      const history = JSON.parse(localStorage.getItem("nextMealHistory") || "[]");
      list.innerHTML = "";
      if (!history.length) {
        list.innerHTML = `<span class="text-[#8b715f] dark:text-[#ead8c5]">還沒有紀錄，第一份香氣正在路上。</span>`;
        return;
      }
      history.forEach(item => {
        const tag = document.createElement("span");
        tag.className = "rounded-full bg-[#fff8e8] px-3 py-1.5 text-hojicha shadow-tiny dark:bg-[#4a4038] dark:text-[#fff1df]";
        tag.textContent = item.name;
        tag.title = item.time;
        list.appendChild(tag);
      });
    }

    function resetAll() {
      state.step = 0;
      state.answers = {};
      state.candidates = [];
      state.winner = null;
      state.spinning = false;
      state.wheelRotation = 0;
      chatLog.innerHTML = "";
      inputArea.innerHTML = "";
      spinBtn.disabled = true;
      wheelHint.textContent = "先和珍珍、雞排君聊幾句，轉盤就會慢慢亮起來。";
      document.getElementById("againTop").classList.add("hidden");
      document.getElementById("resultModal").classList.add("hidden");
      document.getElementById("resultModal").classList.remove("flex");
      drawWheel();
      setTimeout(() => {
        addMessage("bot", "晚安，歡迎來到下一餐的小食堂。珍珍和雞排君在這裡，陪你把飢餓慢慢說清楚。");
        setTimeout(renderQuestion, 520);
      }, 120);
    }

    function closeModal() {
      document.getElementById("resultModal").classList.add("hidden");
      document.getElementById("resultModal").classList.remove("flex");
    }

    document.getElementById("darkToggle").onclick = () => {
      document.documentElement.classList.toggle("dark");
      localStorage.setItem("nextMealDark", document.documentElement.classList.contains("dark") ? "1" : "0");
    };
    document.getElementById("closeModal").onclick = closeModal;
    document.getElementById("keepModal").onclick = closeModal;
    document.getElementById("againModal").onclick = resetAll;
    document.getElementById("againTop").onclick = resetAll;
    document.getElementById("clearHistory").onclick = () => {
      localStorage.removeItem("nextMealHistory");
      renderHistory();
    };
    spinBtn.onclick = spinWheel;
    window.addEventListener("resize", drawWheel);

    if (localStorage.getItem("nextMealDark") === "1") document.documentElement.classList.add("dark");
    addAmbient();
    renderHistory();
    drawWheel();
    resetAll();
  </script>
</body>
</html>
